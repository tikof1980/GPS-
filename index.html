
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeChild AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; color: #333; }
    .container { max-width: 600px; margin: auto; }
    h1 { color: white; text-align: center; margin-bottom: 5px; }
    .subtitle { color: white; text-align: center; margin-bottom: 30px; opacity: 0.9; }
    .card { background: white; padding: 25px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .card h2 { margin-bottom: 15px; color: #444; }
    input { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
    button { width: 100%; padding: 14px; margin-bottom: 10px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; background: #667eea; color: white; transition: 0.2s; }
    button:hover { transform: translateY(-2px); }
    .sos { background: #e74c3c; font-size: 18px; }
    #status, #childInfo { margin-top: 15px; padding: 12px; background: #f4f4f4; border-radius: 8px; font-size: 14px; }
    .alert { background: #e74c3c !important; color: white; animation: blink 0.5s infinite; }
    @keyframes blink { 50% { opacity: 0.6; } }
    a { color: inherit; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛡️ SafeChild AI</h1>
    <p class="subtitle">Sécurité de votre enfant en temps réel</p>

    <div class="card">
      <h2>👧 Mode Enfant</h2>
      <input type="text" id="childName" placeholder="Nom de l'enfant" />
      <button id="startTracking">📍 Activer le suivi</button>
      <button id="sosButton" class="sos">🚨 SOS URGENCE</button>
      <p id="status">En attente...</p>
    </div>

    <div class="card">
      <h2>👨‍👩‍👧 Mode Parent</h2>
      <input type="text" id="watchName" placeholder="Nom de l'enfant à suivre" />
      <button id="watchChild">👁️ Suivre cet enfant</button>
      <div id="childInfo"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC_gTW7kcGL6lLGcjDHENLAY4ixKXSiZ88",
      authDomain: "safechild-7fe11.firebaseapp.com",
      databaseURL: "https://safechild-7fe11-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "safechild-7fe11",
      storageBucket: "safechild-7fe11.firebasestorage.app",
      messagingSenderId: "730535391209",
      appId: "1:730535391209:web:8425961acfd7c2a68b2578"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const status = document.getElementById("status");
    const childInfo = document.getElementById("childInfo");

    document.getElementById("startTracking").onclick = () => {
      const name = document.getElementById("childName").value.trim();
      if (!name) return alert("Entrez un nom !");
      if (!navigator.geolocation) return alert("Géolocalisation non supportée");

      status.textContent = "📡 Suivi activé...";
      navigator.geolocation.watchPosition(
        (pos) => {
          const data = {
            name,
            latitude: pos.coords.latitude,
            longitude: pos.coords.longitude,
            accuracy: pos.coords.accuracy,
            timestamp: new Date().toISOString(),
            sos: false
          };
          set(ref(db, "children/" + name), data);
          status.textContent = `✅ Position envoyée : ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
        },
        (err) => { status.textContent = "❌ Erreur : " + err.message; },
        { enableHighAccuracy: true }
      );
    };

    document.getElementById("sosButton").onclick = () => {
      const name = document.getElementById("childName").value.trim();
      if (!name) return alert("Entrez un nom et activez le suivi d'abord !");
      navigator.geolocation.getCurrentPosition((pos) => {
        set(ref(db, "children/" + name), {
          name,
          latitude: pos.coords.latitude,
          longitude: pos.coords.longitude,
          accuracy: pos.coords.accuracy,
          timestamp: new Date().toISOString(),
          sos: true
        });
        status.textContent = "🚨 ALERTE SOS ENVOYÉE !";
        status.classList.add("alert");
      });
    };

    document.getElementById("watchChild").onclick = () => {
      const name = document.getElementById("watchName").value.trim();
      if (!name) return alert("Entrez le nom de l'enfant !");

      onValue(ref(db, "children/" + name), (snapshot) => {
        const data = snapshot.val();
        if (!data) {
          childInfo.textContent = "Aucune donnée pour cet enfant.";
          return;
        }
        const mapsLink = `https://www.google.com/maps?q=${data.latitude},${data.longitude}`;
        childInfo.innerHTML = `
          <strong>Enfant :</strong> ${data.name}<br>
          <strong>Position :</strong> ${data.latitude.toFixed(5)}, ${data.longitude.toFixed(5)}<br>
          <strong>Précision :</strong> ${Math.round(data.accuracy)} m<br>
          <strong>Heure :</strong> ${new Date(data.timestamp).toLocaleString('fr-FR')}<br>
          <strong>État :</strong> ${data.sos ? "🚨 SOS ACTIVÉ !" : "✅ Normal"}<br>
          <a href="${mapsLink}" target="_blank">📍 Voir sur Google Maps</a>
        `;
        if (data.sos) {
          childInfo.classList.add("alert");
          new Audio("https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg").play().catch(()=>{});
        } else {
          childInfo.classList.remove("alert");
        }
      });
    };
  </script>
</body>
</html>
