
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeChild AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; color: #333; }
    .container { max-width: 600px; margin: auto; }
    h1 { color: white; text-align: center; margin-bottom: 5px; font-size: 28px; }
    .subtitle { color: white; text-align: center; margin-bottom: 30px; opacity: 0.9; }
    .card { background: white; padding: 25px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .card h2 { margin-bottom: 15px; color: #444; }
    input { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
    button { width: 100%; padding: 14px; margin-bottom: 10px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; background: #667eea; color: white; transition: 0.2s; }
    button:hover { transform: translateY(-2px); }
    .sos { background: #e74c3c; font-size: 18px; }
    .mic-btn { background: #27ae60; }
    .mic-btn.active { background: #e74c3c; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { transform: scale(1.02); opacity: 0.9; } }
    #status, #childInfo, #aiLog { margin-top: 15px; padding: 12px; background: #f4f4f4; border-radius: 8px; font-size: 14px; line-height: 1.6; }
    #aiLog { background: #1a1a2e; color: #00ff88; font-family: monospace; max-height: 200px; overflow-y: auto; }
    .alert { background: #e74c3c !important; color: white; animation: blink 0.5s infinite; }
    @keyframes blink { 50% { opacity: 0.6; } }
  </style>
</head>
<body>
<div class="container">
  <h1>🛡️ SafeChild AI</h1>
  <p class="subtitle">Protection intelligente de vos enfants</p>

  <!-- MODE ENFANT -->
  <div class="card">
    <h2>👧 Mode Enfant</h2>
    <input type="text" id="childName" placeholder="Prénom de l'enfant" />
    <button onclick="demarrerEnfant()">📍 Démarrer ma protection</button>
    <button class="mic-btn" id="micBtn" onclick="toggleEcoute()">🎤 Activer écoute IA</button>
    <button class="sos" onclick="envoyerSOS()">🚨 SOS URGENCE</button>
    <div id="status">En attente...</div>
    <div id="aiLog">🤖 IA prête...</div>
  </div>

  <!-- MODE PARENT -->
  <div class="card">
    <h2>👨‍👩‍👧 Mode Parent</h2>
    <input type="text" id="watchName" placeholder="Prénom de l'enfant à surveiller" />
    <button onclick="surveillerEnfant()">👁️ Surveiller mon enfant</button>
    <div id="childInfo">Aucune surveillance active.</div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  // ✅ VOS CLÉS FIREBASE INTÉGRÉES
  const firebaseConfig = {
    apiKey: "AIzaSyC_gTW7kcGL6lLGcjDHENLAY4ixKXSiZ88",
    authDomain: "safechild-7fe11.firebaseapp.com",
    databaseURL: "https://safechild-7fe11-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "safechild-7fe11",
    storageBucket: "safechild-7fe11.firebasestorage.app",
    messagingSenderId: "730535391209",
    appId: "1:730535391209:web:8425961acfd7c2a68b2578"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const status = document.getElementById("status");
  const aiLog = document.getElementById("aiLog");
  const childInfo = document.getElementById("childInfo");

  let nomEnfant = "";
  let ecouteActive = false;
  let recognition = null;
  let salutFait = false;
  let alerteSonnee = false;

  const MOTS_DANGER = [
    "au secours", "help", "danger", "sauve moi", "laisse moi",
    "j'ai peur", "au voleur", "appelle la police", "aidez moi",
    "quelqu'un m'aide", "attaque", "je suis perdu", "je suis blessé"
  ];

  // ✅ PARLER — VOIX IA
  function parler(texte) {
    return new Promise((resolve) => {
      window.speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(texte);
      msg.lang = "fr-FR";
      msg.rate = 1;
      msg.pitch = 1.1;
      msg.volume = 1;
      msg.onend = resolve;
      window.speechSynthesis.speak(msg);
    });
  }

  // ✅ ALERTE SONORE PARENT — AudioContext
  function jouerAlerteParent() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const jouerBip = (freq, debut, duree) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = freq;
        osc.type = "square";
        gain.gain.setValueAtTime(0.8, ctx.currentTime + debut);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + debut + duree);
        osc.start(ctx.currentTime + debut);
        osc.stop(ctx.currentTime + debut + duree);
      };
      // 5 bips d'alarme
      for (let i = 0; i < 5; i++) {
        jouerBip(880, i * 0.4, 0.3);
        jouerBip(440, i * 0.4 + 0.2, 0.2);
      }
    } catch(e) {
      console.log("Erreur audio:", e);
    }
  }

  // ✅ DÉMARRER PROTECTION ENFANT
  window.demarrerEnfant = function() {
    nomEnfant = document.getElementById("childName").value.trim();
    if (!nomEnfant) return alert("Entrez votre prénom !");

    navigator.geolocation.watchPosition(async (pos) => {
      await set(ref(db, "children/" + nomEnfant), {
        name: nomEnfant,
        latitude: pos.coords.latitude,
        longitude: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        timestamp: new Date().toISOString(),
        sos: false,
        motDetecte: ""
      });

      status.textContent = `✅ Protection active — ${nomEnfant}`;

      // ✅ Salut UNE SEULE FOIS
      if (!salutFait) {
        salutFait = true;
        await parler(`Bonjour ${nomEnfant} ! Je suis SafeChild, ton assistant de sécurité. Je suis là pour te protéger. N'hésite pas à dire au secours si tu as besoin d'aide.`);
      }

    }, (err) => {
      status.textContent = "❌ Erreur GPS : " + err.message;
    }, { enableHighAccuracy: true });
  };

  // ✅ ÉCOUTE IA — RÉPOND À CHAQUE MOT DANGER
  window.toggleEcoute = function() {
    const btn = document.getElementById("micBtn");

    if (ecouteActive) {
      ecouteActive = false;
      btn.textContent = "🎤 Activer écoute IA";
      btn.classList.remove("active");
      if (recognition) recognition.stop();
      return;
    }

    if (!("webkitSpeechRecognition" in window) && !("SpeechRecognition" in window)) {
      alert("Votre navigateur ne supporte pas la reconnaissance vocale. Utilisez Chrome.");
      return;
    }

    ecouteActive = true;
    btn.textContent = "🔴 Écoute en cours...";
    btn.classList.add("active");

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = "fr-FR";
    recognition.continuous = true;
    recognition.interimResults = false;

    recognition.onresult = async (event) => {
      const texte = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
      aiLog.textContent = `🎤 Entendu : "${texte}"`;

      const motTrouve = MOTS_DANGER.find(m => texte.includes(m));

      if (motTrouve) {
        aiLog.textContent = `🚨 MOT DANGER : "${motTrouve}"`;

        // ✅ Mettre à jour Firebase avec alerte
        navigator.geolocation.getCurrentPosition(async (pos) => {
          await set(ref(db, "children/" + nomEnfant), {
            name: nomEnfant,
            latitude: pos.coords.latitude,
            longitude: pos.coords.longitude,
            accuracy: pos.coords.accuracy,
            timestamp: new Date().toISOString(),
            sos: true,
            motDetecte: motTrouve
          });
        });

        // ✅ IA répond à chaque mot danger
        await parler(
          `${nomEnfant}, j'ai entendu "${motTrouve}". ` +
          `Tes parents ont été alertés immédiatement. ` +
          `Reste calme, les secours arrivent. Tu n'es pas seul.`
        );

      }
    };

    recognition.onerror = (e) => {
      aiLog.textContent = "❌ Erreur micro : " + e.error;
      if (ecouteActive) setTimeout(() => recognition.start(), 1000);
    };

    recognition.onend = () => {
      // ✅ Redémarre automatiquement si toujours actif
      if (ecouteActive) {
        setTimeout(() => recognition.start(), 500);
      }
    };

    recognition.start();
  };

  // ✅ SOS MANUEL
  window.envoyerSOS = function() {
    if (!nomEnfant) return alert("Démarrez d'abord la protection !");

    navigator.geolocation.getCurrentPosition(async (pos) => {
      await set(ref(db, "children/" + nomEnfant), {
        name: nomEnfant,
        latitude: pos.coords.latitude,
        longitude: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        timestamp: new Date().toISOString(),
        sos: true,
        motDetecte: "SOS MANUEL"
      });

      status.textContent = "🚨 SOS ENVOYÉ !";
      status.classList.add("alert");

      await parler(
        `${nomEnfant}, ton SOS a été envoyé. ` +
        `Tes parents sont prévenus et arrivent. ` +
        `Reste calme, tu n'es pas seul.`
      );
    });
  };

  // ✅ SURVEILLER ENFANT — ALERTE SONORE CORRIGÉE
  window.surveillerEnfant = function() {
    const name = document.getElementById("watchName").value.trim();
    if (!name) return alert("Entrez le prénom !");
    alerteSonnee = false;

    onValue(ref(db, "children/" + name), (snapshot) => {
      const data = snapshot.val();
      if (!data) {
        childInfo.textContent = "Aucune donnée pour cet enfant.";
        return;
      }

      const mapsLink = `https://www.google.com/maps?q=${data.latitude},${data.longitude}`;
      const alerteType = data.motDetecte ? `🗣️ Mot détecté : "${data.motDetecte}"` : "";

      childInfo.innerHTML = `
        <strong>👧 Enfant :</strong> ${data.name}<br>
        <strong>📍 Position :</strong> ${data.latitude.toFixed(5)}, ${data.longitude.toFixed(5)}<br>
        <strong>🎯 Précision :</strong> ${Math.round(data.accuracy)} m<br>
        <strong>🕐 Heure :</strong> ${new Date(data.timestamp).toLocaleString('fr-FR')}<br>
        <strong>📊 État :</strong> ${data.sos ? "🚨 ALERTE !" : "✅ Normal"}<br>
        ${alerteType ? `<strong>⚠️ ${alerteType}</strong><br>` : ""}
        <br><a href="${mapsLink}" target="_blank">📍 Voir sur Google Maps</a>
      `;

      if (data.sos) {
        childInfo.classList.add("alert");
        // ✅ Alerte sonore à chaque nouvelle alerte
        if (!alerteSonnee) {
          alerteSonnee = true;
          jouerAlerteParent();
        }
      } else {
        childInfo.classList.remove("alert");
        alerteSonnee = false;
      }
    });
  };

</script>
</body>
</html>
